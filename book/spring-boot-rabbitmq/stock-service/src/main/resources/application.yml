server:
  port: 7272

spring:
  application:
    name: stock-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated # Publisher Confirm
    publisher-returns: true
    template:
      message-delivery-mode: persistent # message durability
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false #재시도 실패 시 DLQ로 보내기
        retry:
          enabled: true
          initial-interval: 1000ms
          max-retries: 3
          multiplier: 2.0

  # JPA Configuration
  datasource:
    url: jdbc:h2:mem:stockdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true # SQL Query Logging


